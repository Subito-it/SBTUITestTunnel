name: UIKit Tests

on: [pull_request, workflow_dispatch]

env:
  xcode_version: "26.2"
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    name: Build UIKit
    steps:
      - name: List Xcode installations
        run: sudo ls -1 /Applications | grep "Xcode"
      - name: Select Xcode version ${{ env.xcode_version }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.xcode_version }}.app/Contents/Developer
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check build scripts
        run: ruby Scripts/build_lib_test.rb
      - name: Install required tools
        run: |
          brew update
          brew install xcodegen
      - name: Generate UIKit project
        run: |
          xcodegen generate --spec Examples/UIKit/project.yml
          cd Examples/UIKit
          pod install --verbose
      - name: Build UIKit UI Tests
        run: >
          Scripts/build_uitests_products.rb Examples/UIKit/SBTUITestTunnel.xcworkspace DerivedData
          SBTUITestTunnel_Tests SBTUITestTunnel_NoSwizzlingTests MultiSceneExample
      # upload-artifact drops file permissions, so archive the products to keep app executables runnable.
      - name: Archive build products
        run: tar -cf UIKitProducts.tar -C DerivedData/Build Products
      - name: Upload build products
        uses: actions/upload-artifact@v7
        with:
          name: UIKitProducts
          path: UIKitProducts.tar
          retention-days: 1

  test:
    needs: build
    runs-on: macos-15
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UIKit Tests
            scheme: SBTUITestTunnel_Tests
            family: iPhone
            artifact: SBTUITestTunnel_UIKit_Tests.xcresult
          - name: UIKit No Swizzling Tests
            scheme: SBTUITestTunnel_NoSwizzlingTests
            family: iPhone
            artifact: SBTUITestTunnel_UIKit_NoSwizzling.xcresult
          - name: UIKit Multi-scene Tests (iPad)
            scheme: MultiSceneExample
            family: iPad
            artifact: MultiSceneExample_iOS.xcresult
    steps:
      - name: Select Xcode version ${{ env.xcode_version }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.xcode_version }}.app/Contents/Developer
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download build products
        uses: actions/download-artifact@v8
        with:
          name: UIKitProducts
      - name: Extract build products
        run: |
          mkdir -p DerivedData/Build
          tar -xf UIKitProducts.tar -C DerivedData/Build
      - name: Run ${{ matrix.name }}
        id: uitests
        run: Scripts/run_prebuilt_uitests.rb DerivedData/Build/Products ${{ matrix.scheme }} ${{ matrix.family }}
      - name: Collect ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.scheme }}.xcresult
        if: ${{ !cancelled() && steps.uitests.outcome != 'skipped' }}
