name: SBTUITestTunnel

options:
  bundleIdPrefix: com.subito
  groupSortPosition: top

fileGroups:
  - SBTUITestTunnel_Example.entitlements

targets:
  SBTUITestTunnel_Example:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        INFOPLIST_FILE: "SBTUITestTunnel/SBTUITestTunnel-Info.plist"
        CODE_SIGN_ENTITLEMENTS: "SBTUITestTunnel_Example.entitlements"
    sources:
      - path: SBTUITestTunnel
        excludes: ["*-Info.plist"]
        name: "SBTUITestTunnel_Example"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework

  SBTUITestTunnel_Tests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        INFOPLIST_FILE: "SBTUITestTunnel_Tests/Info.plist"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UIKIT_APP"
    sources:
      - path: SBTUITestTunnel_Tests
        excludes: [Info.plist]
      - path: ../SharedUITests
        name: SharedUITests
    dependencies:
      - target: SBTUITestTunnel_Example

  SBTUITestTunnel_TestsNoSwizzling:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS:
          ["DISABLE_UITUNNEL_SWIZZLING=1", "$(inherited)"]
        INFOPLIST_FILE: "SBTUITestTunnel_TestsNoSwizzling/Info.plist"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UIKIT_APP"
    sources:
      - SBTUITestTunnel_TestsNoSwizzling
    dependencies:
      - target: SBTUITestTunnel_Example

  MultiSceneExample:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        INFOPLIST_FILE: "MultiSceneExample/MultiSceneExample-Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: "com.subito.MultiSceneExample"
    sources:
      - path: MultiSceneExample
        excludes: ["*-Info.plist"]
        name: "MultiSceneExample"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework

  MultiSceneExample_Tests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    settings:
      base:
        INFOPLIST_FILE: "MultiSceneExample_Tests/Info.plist"
    sources:
      - MultiSceneExample_Tests
    dependencies:
      - target: MultiSceneExample

schemes:
  SBTUITestTunnel:
    build:
      targets:
        SBTUITestTunnel_Example: [run, test, profile, analyze, archive]
      config: Debug
    profile:
      config: Debug
    test:
      targets:
        - SBTUITestTunnel_Tests
      config: Debug
      gatherCoverageData: true
      disableMainThreadChecker: true
      language: en
      region: EN

  SBTUITestTunnel_Tests:
    run:
      debugEnabled: false
    build:
      targets:
        SBTUITestTunnel_Example: [run, test, profile, analyze, archive]
      config: Debug
    profile:
      config: Debug
    test:
      targets:
        - SBTUITestTunnel_Tests
      config: Debug
      gatherCoverageData: true
      disableMainThreadChecker: true
      debugEnabled: false
      language: en
      region: EN
    management:
      isShown: false

  SBTUITestTunnel_NoSwizzlingTests:
    run:
      debugEnabled: false
    build:
      targets:
        SBTUITestTunnel_Example: [run, test, profile, analyze, archive]
      config: Debug
    profile:
      config: Debug
    test:
      targets:
        - SBTUITestTunnel_TestsNoSwizzling
      config: Debug
      gatherCoverageData: true
      disableMainThreadChecker: true
      debugEnabled: false
      language: en
      region: EN
    management:
      isShown: false

  MultiSceneExample:
    run:
      debugEnabled: false
    build:
      targets:
        MultiSceneExample: [run, test, profile, analyze, archive]
      config: Debug
    profile:
      config: Debug
    test:
      targets:
        - MultiSceneExample_Tests
      config: Debug
      gatherCoverageData: true
      disableMainThreadChecker: true
      debugEnabled: false
      language: en
      region: EN
